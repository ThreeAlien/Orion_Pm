# orion-pm.allwebs.com.tw — 給「容器化反向代理 threealien-nginx」用的 server block。
# Cloudflare Flexible SSL：CF 邊緣 HTTPS，origin 收 HTTP（80）。
# CF 永遠走 HTTPS 到 client，所以這裡固定把 X-Forwarded-Proto 寫成 https，
# 讓 Next.js / Auth.js 產生的 URL 都是 https://orion-pm.allwebs.com.tw/...
#
# ⚠️ 反代是 threealien-nginx「容器」，不是 host nginx。所以 proxy_pass 要用
#    docker 容器名 orion-pm:3000（走 threealien_network），不能用 host loopback
#    127.0.0.1:8083（那是 host 上的 published port，容器內看是空的 → 502/520）。
#
# 套用：把這份放進 threealien-nginx 掛載的 conf.d 目錄 →
#   docker exec threealien-nginx nginx -t && docker exec threealien-nginx nginx -s reload

server {
    listen 80;
    listen [::]:80;
    server_name orion-pm.allwebs.com.tw;

    # 上傳 / 大型 payload（富文本貼圖等）放寬一點
    client_max_body_size 20m;

    # 用 CF 帶來的真實 IP 取代 CF edge IP（access log 才有意義）
    # 需要先 include /etc/nginx/cloudflare.conf 或在 http {} 塊載入 real_ip 設定
    # 若還沒做，可以晚點補
    # real_ip_header CF-Connecting-IP;

    location / {
        # 容器名（threealien_network）— 不是 host 的 127.0.0.1:8083
        proxy_pass http://orion-pm:3000;
        proxy_http_version 1.1;

        # WebSocket / SSE 用
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Flexible SSL：CF→origin 是 http，但對外是 https，要寫死 https
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_buffering off;
    }
}
