services:
  # 自架 PostgreSQL（2026-06-06 從 Neon 搬回 Linode 本機）。
  # 帳密 / DB 名走 .env.production 的 POSTGRES_USER/PASSWORD/DB，
  # app 用 DATABASE_URL=postgresql://orion:<pw>@orion-db:5432/orion 走容器名連這顆。
  db:
    image: postgres:17-alpine
    container_name: orion-db
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      # 具名 volume，資料不隨容器重建消失；redeploy 也沿用同一顆
      - orion_pgdata:/var/lib/postgresql/data
    networks:
      - threealien_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion -d orion"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: orion-pm:latest
    container_name: orion-pm
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # 只綁 loopback，純供 host 本機除錯用；對外流量走 threealien_network 由 nginx 代理
      - "127.0.0.1:8083:3000"
    env_file:
      - .env.production
    networks:
      # 加入既有反向代理(threealien-nginx)所在的網路，讓 nginx 可用容器名 orion-pm:3000 連到
      - threealien_network
    healthcheck:
      # 用 node 內建 http 避免依賴 wget/curl；只要 server 有回 < 500 都算活著（不打 DB）
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/login', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # 一次性 migration 容器：用 builder 階段（含完整 node_modules，有 prisma CLI + effect 等）
  # 不會被 `docker compose up` 啟動（profiles），只在部署流程用 `docker compose run --rm migrate` 觸發
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: orion-pm-builder:latest
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    profiles: ["migrate"]

networks:
  # 既有的反向代理網路（由 ThreeAlien_BackEnd 那組 compose 建立），這裡以 external 參照
  threealien_network:
    external: true

volumes:
  # 具名（非 compose 專案前綴）→ 手動建的同名 volume 也吃得到，redeploy 不會換顆
  orion_pgdata:
    name: orion_pgdata
