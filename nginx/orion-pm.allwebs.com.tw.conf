# /etc/nginx/sites-available/orion-pm.allwebs.com.tw.conf
# Cloudflare Flexible SSL：CF 邊緣 HTTPS，origin 收 HTTP（80）。
# CF 永遠走 HTTPS 到 client，所以這裡固定把 X-Forwarded-Proto 寫成 https，
# 讓 Next.js / Auth.js 產生的 URL 都是 https://orion-pm.allwebs.com.tw/...
#
# 啟用：
#   sudo ln -s /etc/nginx/sites-available/orion-pm.allwebs.com.tw.conf \
#              /etc/nginx/sites-enabled/orion-pm.allwebs.com.tw.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name orion-pm.allwebs.com.tw;

    # 上傳 / 大型 payload（富文本貼圖等）放寬一點
    client_max_body_size 20m;

    # 用 CF 帶來的真實 IP 取代 CF edge IP（access log 才有意義）
    # 需要先 include /etc/nginx/cloudflare.conf 或在 http {} 塊載入 real_ip 設定
    # 若還沒做，可以晚點補
    # real_ip_header CF-Connecting-IP;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;

        # WebSocket / SSE 用
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Flexible SSL：CF→origin 是 http，但對外是 https，要寫死 https
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_buffering off;
    }
}
